name: check

# Verifies this family on every push: parsing tests on saved pages (pytest), then scrape-check, which runs setup_family.py and the
# crawl task against a local stand-in for scrape-hub, the same way the pool runner does, on 2 real queue items (and a rerun).
# Nothing reaches the real hub. Run it by hand too: Actions -> check -> Run workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt pytest "scrape-hub-client @ git+https://github.com/s1d-labs/runner@sdk-stable#subdirectory=sdk"
          python3 -c "import json; [print(c) for c in json.load(open('scrape.json')).get('setup', [])]" | grep -v "requirements.txt" | while IFS= read -r cmd; do bash -c "$cmd"; done
      - name: Parsing tests
        run: python -m pytest tests -q
      - name: scrape-check (local stand-in hub, 2 real items)
        run: scrape-check --items 2
      # tnmsc.tn.gov.in and rmsc.health.rajasthan.gov.in do not answer GitHub's runners (2026-11-14: every request timed out);
      # the pool runs them through an Indian proxy (proxy="IN"), which this workflow does not have. These steps show the state
      # and do not fail the check; on a team box run `myproxy run scrape-check --items 2 --project <project>`.
      - name: scrape-check TNMSC and RMSC (informational; the sites need an Indian proxy)
        continue-on-error: true
        run: |
          scrape-check --items 1 --no-rerun --project medical-procurement-rmsc --timeout 200 || true
          scrape-check --items 1 --no-rerun --project medical-procurement-tnmsc --timeout 200
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: scrape-check
          path: .scrape-check/
          if-no-files-found: ignore
