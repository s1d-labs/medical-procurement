name: check

# Verifies this family on every push: parsing tests on saved pages (pytest), then scrape-check, which runs setup_family.py and the
# crawl task against a local stand-in for scrape-hub, the same way the pool runner does, on 2 real queue items (and a rerun).
# Nothing reaches the real hub. Run it by hand too: Actions -> check -> Run workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install -q -r requirements.txt pytest "scrape-hub-client @ git+https://github.com/s1d-labs/runner@sdk-stable#subdirectory=sdk"
          python3 -c "import json; [print(c) for c in json.load(open('scrape.json')).get('setup', [])]" | grep -v "requirements.txt" | while IFS= read -r cmd; do bash -c "$cmd"; done
      - name: Parsing tests
        run: python -m pytest tests -q
      - name: scrape-check (local stand-in hub, 2 real items)
        run: scrape-check --items 2
      - name: scrape-check RMSC (GitHub's runners reach rmsc.health.rajasthan.gov.in without a proxy)
        run: scrape-check --items 2 --no-rerun --project medical-procurement-rmsc --timeout 300
      # tnmsc.tn.gov.in does not answer GitHub's runners (2026-11-14: both pages timed out); the pool runs it through an Indian
      # proxy (proxy="IN"), which this workflow does not have. The step shows the state and does not fail the check.
      - name: scrape-check TNMSC (informational; needs an Indian proxy)
        continue-on-error: true
        run: scrape-check --items 2 --no-rerun --project medical-procurement-tnmsc --timeout 300
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: scrape-check
          path: .scrape-check/
          if-no-files-found: ignore
